<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hanselius.dev</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,640&family=Outfit:wght@400;500;600&display=swap">
<style>
/* Interim page while the two-mode site (Apollo / Bacchus) is designed */
:root{
  --bg:#0d0b16;
  --surface:#171329;
  --line:#2b2443;
  --fg:#f0ebe1;
  --muted:#a99fbd;
  --accent:#e6b655;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:"Outfit",-apple-system,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh; display:grid; place-items:center;
  padding:24px 16px; text-align:center; line-height:1.6;
}
h1{font-family:"Fraunces",Georgia,serif; font-weight:640; font-size:clamp(40px,9vw,72px); margin:0 0 10px}
p{color:var(--muted); max-width:34em; margin:0 auto}
.eyebrow{font-size:12px; letter-spacing:.22em; text-transform:uppercase; margin-bottom:16px}
a{color:var(--accent)}
.card{border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:28px 26px}
.foot{margin-top:22px; font-size:13px; font-style:italic}
</style>
</head>
<body>
<div class="card">
  <p class="eyebrow">Intermission</p>
  <h1>hanselius.dev</h1>
  <p>The next movement is in rehearsal: one site, two faces &mdash; <strong>Apollo</strong> for the professional record, <strong>Bacchus</strong> for everything else worth doing.</p>
  <p class="foot">Previously playing: <a href="archive/overture/">the Overture</a>.</p>
</div>
</body>
</html>
