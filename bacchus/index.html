<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bacchus — Hansel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,640;1,9..144,500;1,9..144,640&family=Outfit:wght@400;500;600&display=swap">
<style>
/* Bacchus: dark, wine-stained, loose. This is a stub until Apollo ships. */
:root{
  --bg:#150a16; --ink:#f0e6ea; --muted:#a08fa6; --wine:#c25a7c; --line:#372338;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Outfit",-apple-system,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh; display:grid; place-items:center;
  padding:24px max(16px, env(safe-area-inset-left,0px)); line-height:1.6;
}
main{max-width:34em; text-align:center}
.eyebrow{font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--wine); margin:0 0 14px}
h1{font-family:"Fraunces",Georgia,serif; font-style:italic; font-weight:640; font-size:clamp(34px,7vw,56px); margin:0 0 12px; line-height:1.05}
p{color:var(--muted); margin:0 0 14px}
a{color:var(--wine)}
.rule{border:none; border-top:1px solid var(--line); margin:26px auto; width:120px}
.nav{font-size:13.5px; display:flex; gap:18px; justify-content:center; flex-wrap:wrap}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Bacchus &middot; Fermenting</p>
  <h1>The creative disorder</h1>
  <p>Music written and sung, choir Sundays, laps at dawn, food worth burning twice. Pouring once Apollo has had his say.</p>
  <p>Contact page arrives with the first pour.</p>
  <hr class="rule">
  <nav class="nav">
    <a href="../">&#8592; The gate</a>
    <a href="../apollo/">Back to business &#8594;</a>
  </nav>
</main>
</body>
</html>
